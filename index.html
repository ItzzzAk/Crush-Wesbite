<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Do You Love Me? ❤️</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>

    <div class="container">
        <div class="content">
            <img id="catImage" src="cat1.gif" alt="Cute Cat">
            <h1 id="question">Do you love me? 😽</h1>
            <p id="subtext">Lucky tera hi hai 😘</p>
            <div class="buttons">
                <button id="yesBtn">Yes</button>
                <button id="noBtn">No</button>
            </div>
        </div>
    </div>


    <div class="celebration hidden">
        <img src="cat8.gif" alt="Love Cats">
        <h1>Hehehe, I knew it! 😘</h1>
        <p>Ab toh mujhe lifetime ke liye jhelna padega! ❤️</p>
    </div>

   
    <div id="fallingHearts"></div>

    <script src="script.js"></script>
</body>
</html>
